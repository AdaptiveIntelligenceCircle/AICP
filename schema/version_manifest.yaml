    checksum: "a8ff62a28fbe2302c35ef92cd3b..."
    dependencies: ["utils >= 1.0.0", "security >= 1.0.0"]
  utils:
    version: "1.0.1"
    checksum: "7c9e16c2328a119..."
  security:
    version: "1.1.0"
    checksum: "3d7b9f6d4a..."
  transport:
    version: "1.0.0"
    checksum: "e38c28ff1b..."
  language:
    version: "0.9.3"
    implemented_in: ["Lua", "C++"]
  runtime:
    version: "1.0.0"
    compatibility: ">= core 1.0.0"

integrations:
  rust_plugin:
    version: "0.3.4"
    path: "plugins/rust/"
