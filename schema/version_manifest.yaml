integrity_validation:
  enabled: true
  verify_on_boot: true
  boot_hash: "73b3c194fe9a1e..."
  trusted_source: "git@aicp.repo/adaptive.git"

history:
  - version: "0.9.9"
    date: "2025-10-15"
